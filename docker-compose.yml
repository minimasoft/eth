services:
  surrealdb:
    image: surrealdb/surrealdb:latest
    command: start -u root -p root
    ports:
    - 8000:8000
    volumes:
    - surrealdb_data:/data
    environment:
      SURREAL_USER: root
      SURREAL_PASS: root
    healthcheck:
      test:
      - CMD
      - /surreal
      - is-ready
      interval: 5s
      retries: 6
      start_period: 10s
      timeout: 5s
    restart: unless-stopped
    networks:
    - eth-pipeline
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
    - 9000:9000
    - 9001:9001
    volumes:
    - minio_data:/data
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    healthcheck:
      test:
      - CMD-SHELL
      - curl -f http://localhost:9000/minio/health/live || exit 1
      interval: 5s
      retries: 6
      start_period: 10s
      timeout: 5s
    restart: unless-stopped
    networks:
    - eth-pipeline
  temporal-server:
    image: temporalio/temporal:latest
    command: server start-dev --ip 0.0.0.0
    ports:
    - 7233:7233
    - 8233:8233
    environment:
    - TEMPORAL_ADDRESS=temporal-server:7233
    healthcheck:
      test:
      - CMD
      - temporal
      - operator
      - cluster
      - describe
      interval: 5s
      retries: 6
      start_period: 15s
      timeout: 5s
    restart: unless-stopped
    networks:
    - eth-pipeline
  temporal-ui:
    image: temporalio/ui:latest
    ports:
    - 8080:8080
    environment:
      TEMPORAL_ADDRESS: temporal-server:7233
    depends_on:
      temporal-server:
        condition: service_started
    restart: unless-stopped
    networks:
    - eth-pipeline
  schema-init:
    build: .
    command: uv run python scripts/init_schema.py
    env_file: .env
    environment:
      SURREAL_URL: http://surrealdb:8000
    depends_on:
      surrealdb:
        condition: service_healthy
    restart: 'no'
    networks:
    - eth-pipeline
  bucket-init:
    build: .
    command: uv run python scripts/init_bucket.py
    env_file: .env
    environment:
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_BUCKET: eth-documents
      MINIO_SECURE: "false"
    depends_on:
      minio:
        condition: service_healthy
    restart: 'no'
    networks:
    - eth-pipeline
  api:
    build: .
    command: uv run python scripts/run_api.py
    ports:
    - 1985:8001
    env_file: .env
    environment:
      SURREAL_URL: ws://surrealdb:8000/rpc
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request, sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8001/health').status == 200 else 1)
      interval: 5s
      retries: 6
      start_period: 15s
      timeout: 5s
    depends_on:
      schema-init:
        condition: service_completed_successfully
      temporal-server:
        condition: service_started
    restart: unless-stopped
    networks:
    - eth-pipeline
  worker:
    build: .
    command: uv run python scripts/run_worker.py
    env_file: .env
    environment:
      SURREAL_URL: ws://surrealdb:8000/rpc
    depends_on:
      schema-init:
        condition: service_completed_successfully
      temporal-server:
        condition: service_started
    restart: unless-stopped
    networks:
    - eth-pipeline
  integration-tests:
    image: node:22-slim
    working_dir: /tests
    command:
      sh -c "npm install --silent && npx tsc && node --test dist/*.test.js"
    volumes:
      - ./tests/integration:/tests
    environment:
      API_URL: http://api:8001
      SURREAL_HTTP: http://surrealdb:8000
      SURREAL_USER: ${SURREAL_USER:-root}
      SURREAL_PASS: ${SURREAL_PASS:-root}
      SURREAL_NS: ${SURREAL_NS:-eth}
      SURREAL_DB: ${SURREAL_DB:-pipeline}
    depends_on:
      api:
        condition: service_healthy
    restart: "no"
    networks:
      - eth-pipeline
  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run --token $TUNNEL_TOKEN
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    restart: unless-stopped
    networks:
    - eth-pipeline
volumes:
  surrealdb_data: null
  minio_data: null
networks:
  eth-pipeline:
    driver: bridge
