services:
  postgres:
    image: postgis/postgis:17-3.4-alpine
    ports:
    - 15432:5432
    volumes:
    - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: eth
      POSTGRES_PASSWORD: eth
      POSTGRES_DB: eth
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U eth -d eth
      interval: 5s
      retries: 6
      start_period: 10s
      timeout: 5s
    restart: unless-stopped
    networks:
    - eth-pipeline
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
    - 19000:9000
    - 19001:9001
    volumes:
    - minio_data:/data
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    healthcheck:
      test:
      - CMD-SHELL
      - curl -f http://localhost:9000/minio/health/live || exit 1
      interval: 5s
      retries: 6
      start_period: 10s
      timeout: 5s
    restart: unless-stopped
    networks:
    - eth-pipeline
  temporal-server:
    image: temporalio/temporal:latest
    command: server start-dev --ip 0.0.0.0
    ports:
    - 17233:7233
    - 18233:8233
    environment:
    - TEMPORAL_ADDRESS=temporal-server:7233
    healthcheck:
      test:
      - CMD
      - temporal
      - operator
      - cluster
      - describe
      interval: 5s
      retries: 6
      start_period: 15s
      timeout: 5s
    restart: unless-stopped
    networks:
    - eth-pipeline
  temporal-ui:
    image: temporalio/ui:latest
    ports:
    - 18080:8080
    environment:
      TEMPORAL_ADDRESS: temporal-server:7233
    depends_on:
      temporal-server:
        condition: service_started
    restart: unless-stopped
    networks:
    - eth-pipeline
  schema-init:
    build: .
    command: uv run python scripts/init_schema.py
    env_file: .env
    environment:
      PGUSER: eth
      PGPASSWORD: eth
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: eth
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'
    networks:
    - eth-pipeline
  bucket-init:
    build: .
    command: uv run python scripts/init_bucket.py
    env_file: .env
    environment:
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_BUCKET: eth-documents
      MINIO_SECURE: "false"
    depends_on:
      minio:
        condition: service_healthy
    restart: 'no'
    networks:
    - eth-pipeline
  api:
    build: .
    command: uv run python scripts/run_api.py
    ports:
    - 18001:8001
    env_file: .env
    environment:
      PGUSER: eth
      PGPASSWORD: eth
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: eth
      CHUNK_SIZE_TARGET: ${CHUNK_SIZE_TARGET:-524288}
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request, sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8001/health').status == 200 else 1)
      interval: 5s
      retries: 6
      start_period: 15s
      timeout: 5s
    depends_on:
      schema-init:
        condition: service_completed_successfully
      temporal-server:
        condition: service_started
    restart: unless-stopped
    networks:
    - eth-pipeline
  worker:
    build: .
    command: uv run python scripts/run_worker.py
    env_file: .env
    environment:
      PGUSER: eth
      PGPASSWORD: eth
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: eth
      CHUNK_SIZE_TARGET: ${CHUNK_SIZE_TARGET:-524288}
    depends_on:
      schema-init:
        condition: service_completed_successfully
      temporal-server:
        condition: service_started
    restart: unless-stopped
    networks:
    - eth-pipeline
  python-tests:
    profiles: ["test"]
    build: .
    command: uv run pytest
    env_file: .env
    environment:
      PGUSER: eth
      PGPASSWORD: eth
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: eth
    volumes:
      - ./src:/app/src
      - ./tests:/app/tests
      - ./test_data:/app/test_data:ro
      - ./alembic.ini:/app/alembic.ini:ro
      - uv-cache:/root/.cache/uv
    depends_on:
      postgres:
        condition: service_healthy
      schema-init:
        condition: service_completed_successfully
    restart: "no"
    networks:
      - eth-pipeline
  integration-tests:
    profiles: ["test"]
    image: node:22-slim
    working_dir: /tests
    command:
      sh -c "npm install --silent && npm test"
    volumes:
      - ./tests/integration:/tests
    environment:
      API_URL: http://api:8001
      PGUSER: eth
      PGPASSWORD: eth
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: eth
    depends_on:
      api:
        condition: service_healthy
    restart: "no"
    networks:
      - eth-pipeline
  cloudflared:
    profiles: ["tunnel"]
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run --token $TUNNEL_TOKEN
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    restart: unless-stopped
    networks:
    - eth-pipeline
volumes:
  postgres_data:
  minio_data:
  uv-cache:
networks:
  eth-pipeline:
    driver: bridge
