services:
  surrealdb:
    image: surrealdb/surrealdb:latest
    command: start -u root -p root
    ports:
      - "8000:8000"
    volumes:
      - surrealdb_data:/data
    environment:
      SURREAL_USER: root
      SURREAL_PASS: root
    healthcheck:
      test: ["CMD", "/surreal", "is-ready"]
      interval: 5s
      retries: 6
      start_period: 10s
      timeout: 5s
    restart: unless-stopped
    networks:
      - eth-pipeline

  temporal-server:
    image: temporalio/temporal:latest
    command: server start-dev --ip 0.0.0.0
    ports:
      - "7233:7233"    # gRPC
      - "8233:8233"    # HTTP metrics
    environment:
      - TEMPORAL_ADDRESS=temporal-server:7233
    healthcheck:
      test: ["CMD", "temporal", "operator", "cluster", "describe"]
      interval: 5s
      retries: 6
      start_period: 15s
      timeout: 5s
    restart: unless-stopped
    networks:
      - eth-pipeline

  temporal-ui:
    image: temporalio/ui:latest
    ports:
      - "8080:8080"
    environment:
      TEMPORAL_ADDRESS: temporal-server:7233
    depends_on:
      temporal-server:
        condition: service_started
    restart: unless-stopped
    networks:
      - eth-pipeline

volumes:
  surrealdb_data:

networks:
  eth-pipeline:
    driver: bridge
