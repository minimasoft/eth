<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ETH Pipeline</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body { margin: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 16px;
      line-height: 1.5;
      color: #1e293b;
      background: #ffffff;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 10;
      height: 56px;
      background: #2563eb;
      display: flex;
      align-items: center;
      padding: 0 24px;
    }

    header h1 {
      font-size: 28px;
      font-weight: 700;
      line-height: 1.2;
      color: #ffffff;
    }

    nav {
      position: sticky;
      top: 56px;
      z-index: 10;
      height: 44px;
      background: #ffffff;
      border-bottom: 1px solid #e2e8f0;
      display: flex;
      align-items: center;
      padding: 0 24px;
      gap: 0;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }

    nav button {
      font-family: inherit;
      font-size: 14px;
      font-weight: 500;
      line-height: 1.4;
      color: #64748b;
      background: none;
      border: none;
      height: 44px;
      padding: 0 16px;
      cursor: pointer;
      border-bottom: 2px solid transparent;
      flex-shrink: 0;
      transition: background 0.15s;
    }

    nav button:hover {
      background: #f1f5f9;
    }

    nav button.active {
      color: #2563eb;
      font-weight: 600;
      border-bottom-color: #2563eb;
    }

    main {
      max-width: 960px;
      margin: 0 auto;
      padding: 24px;
    }

    .tab-content { display: none; }
    .tab-content.active { display: block; }

    .placeholder-card {
      background: #f8fafc;
      border-radius: 8px;
      padding: 48px;
      text-align: center;
      color: #64748b;
    }

    .placeholder-card .icon {
      font-size: 48px;
      margin-bottom: 16px;
    }

    .placeholder-card h2 {
      font-size: 24px;
      font-weight: 600;
      line-height: 1.3;
      color: #1e293b;
      margin-bottom: 8px;
    }

    .placeholder-card p {
      font-size: 16px;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <header>
    <h1>ETH Pipeline</h1>
  </header>

  <nav role="tablist" aria-label="Main navigation">
    <button role="tab" aria-selected="true" aria-controls="tab-upload" id="tab-btn-upload" data-tab="upload">Upload</button>
    <button role="tab" aria-selected="false" aria-controls="tab-documents" id="tab-btn-documents" data-tab="documents">Documents</button>
    <button role="tab" aria-selected="false" aria-controls="tab-entities" id="tab-btn-entities" data-tab="entities">Entities</button>
  </nav>

  <main>
    <section id="tab-upload" role="tabpanel" aria-labelledby="tab-btn-upload" class="tab-content">
      <div class="placeholder-card">
        <div class="icon" aria-hidden="true">📄</div>
        <h2>Upload Documents</h2>
        <p>Upload documents to the extraction pipeline</p>
      </div>
    </section>

    <section id="tab-documents" role="tabpanel" aria-labelledby="tab-btn-documents" class="tab-content">
      <div class="placeholder-card">
        <div class="icon" aria-hidden="true">📋</div>
        <h2>Documents</h2>
        <p>View your uploaded documents</p>
      </div>
    </section>

    <section id="tab-entities" role="tabpanel" aria-labelledby="tab-btn-entities" class="tab-content">
      <div class="placeholder-card">
        <div class="icon" aria-hidden="true">🔍</div>
        <h2>Entities</h2>
        <p>Browse extracted entities</p>
      </div>
    </section>
  </main>

  <script>
    const tabs = document.querySelectorAll('nav button');
    const sections = {
      upload: document.getElementById('tab-upload'),
      documents: document.getElementById('tab-documents'),
      entities: document.getElementById('tab-entities'),
    };

    function switchTab(tabName) {
      const section = sections[tabName];
      const tabButton = document.querySelector(`nav button[data-tab="${tabName}"]`);
      if (!section || !tabButton) {
        console.warn('switchTab: unknown tab "%s" — ignoring', tabName);
        return;
      }
      tabs.forEach(t => {
        t.classList.remove('active');
        t.setAttribute('aria-selected', 'false');
      });
      Object.values(sections).forEach(s => s.classList.remove('active'));
      section.classList.add('active');
      tabButton.classList.add('active');
      tabButton.setAttribute('aria-selected', 'true');
    }

    tabs.forEach(tab => {
      tab.addEventListener('click', () => switchTab(tab.dataset.tab));
    });

    switchTab('upload');
  </script>
</body>
</html>
