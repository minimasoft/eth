[project]
name = "eth-pipeline"
version = "0.1.0"
description = "Espacio Tiempo Humanos document processing pipeline with Temporal and PostgreSQL"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.18.4",
    "asyncpg>=0.30.0",
    "fastapi[standard]>=0.115.0",
    "httpx>=0.28.0",
    "jsonschema>=4.26.0",
    "langchain-text-splitters>=0.3.0",
    "minio>=7.2.0",
    "nltk>=3.9.4",
    "pypdf>=5.1.0",
    "pypdfium2>=4.30.0",
    "sqlalchemy[asyncio]>=2.0.50",
    "temporalio>=1.10.0",
    "uvicorn>=0.34.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eth_pipeline"]

[tool.uv]

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.21",
]
