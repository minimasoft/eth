[project]
name = "eth-pipeline"
version = "0.1.0"
description = "Espacio Tiempo Humanos document processing pipeline with Temporal and SurrealDB"
requires-python = ">=3.11"
dependencies = [
    "temporalio>=1.10.0",
    "surrealdb>=0.3.0",
    "fastapi[standard]>=0.115.0",
    "uvicorn>=0.34.0",
    "httpx>=0.28.0",
    "jsonschema>=4.26.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eth_pipeline"]

[tool.uv]

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
